[providers]
php = {}

[phases.setup]
nixPkgs = ["...", "php82", "nodejs"]

[phases.install]
cmds = ["composer install --frozen-lockfile --no-dont-discover --no-scripts", "npm install"]

[phases.build]
cmds = ["npm run build", "php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"